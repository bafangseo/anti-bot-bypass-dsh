# Opt-in anti-bot-bypass filesystem Skill provider for DeepSeek Harness.
# Resolves the packaged Skill root from the installed npm identity anchored at
# the DSH profile (Loader baseUrl), never as a path concatenated onto baseUrl.
- insert:
    - id: anti-bot-bypass-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: anti-bot-bypass-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@ww15799927711/anti-bot-bypass-dsh/package.json')), 'skills')
